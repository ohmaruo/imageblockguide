<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>画像ブロックガイド</title>
<style>body{font-family:Arial,"Noto Sans JP";background:#f7f5f2;margin:0;color:#333}.w{max-width:1000px;margin:auto;padding:20px}.card{background:#fff;padding:20px;border-radius:16px}.drop{display:block;border:2px dashed #ccc;padding:25px;text-align:center;border-radius:12px}input[type=file]{display:none}.g{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}.f{width:100%;padding:9px;border:1px solid #ddd;border-radius:8px;margin-top:4px}.colors{margin-top:16px;border:1px solid #eadfd5;border-radius:10px;padding:12px}.cl{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}.ci{border:1px solid #eee;padding:7px;border-radius:8px}.btn{margin-top:14px;padding:10px 15px;border:0;border-radius:8px;background:#444;color:#fff;font-weight:bold}.stage{margin-top:18px;background:#eee;padding:10px;text-align:center;overflow:auto}.stage canvas{max-width:100%;height:auto}.empty{padding:50px;color:#999}@media(max-width:700px){.g{grid-template-columns:1fr 1fr}}</style>
<div class="w"><div class="card"><h2>▦ 画像ブロックガイド</h2><p>色分けを「縦（列）」か「横（行）」から選べます。</p>
<label class="drop">画像をアップロード<input id="file" type="file" accept="image/*"></label>
<div class="g"><div>横<input id="cols" class="f" type="number" min="1" max="20" value="3"></div><div>縦<input id="rows" class="f" type="number" min="1" max="20" value="2"></div><div>線の太さ<input id="lw" class="f" type="number" value="4"></div><div>透明度<input id="op" class="f" type="number" value="35" min="0" max="100"></div></div>
<div class="g"><div>色分け方向<select id="dir" class="f"><option value="v">縦方向（列ごと）</option><option value="h">横方向（行ごと）</option></select></div><div>線の色<input id="lc" class="f" type="color" value="#ff0000"></div><div>番号<select id="num" class="f"><option>表示</option><option>非表示</option></select></div><div>番号サイズ<input id="fs" class="f" type="number" value="55"></div></div>
<div class="colors"><b id="title">列ごとの色</b><div id="colors" class="cl"></div></div>
<button id="save" class="btn" disabled>PNG保存</button><div id="stage" class="stage"><div id="empty" class="empty">ここに表示されます</div><canvas id="cv" hidden></canvas></div>
</div></div>
<script>
const $=x=>document.getElementById(x);let im=null,pal=["#ff6b6b","#ffa94d","#ffd43b","#69db7c","#38d9a9","#4dabf7","#748ffc","#b197fc","#f783ac","#adb5bd"];
function colors(){let vertical=$("dir").value==="v",n=vertical?+$("cols").value:+$("rows").value,b=$("colors");$("title").textContent=vertical?"列ごとの色":"行ごとの色";b.innerHTML="";for(let i=0;i<n;i++)b.innerHTML+=`<div class="ci">${i+1}${vertical?"列":"行"}目<br><input id="e${i}" type="checkbox" checked><input id="c${i}" type="color" value="${pal[i%pal.length]}"></div>`;for(let i=0;i<n;i++)["e"+i,"c"+i].forEach(id=>$(id).oninput=draw)}
function draw(){if(!im)return;let c=$("cv"),x=c.getContext("2d"),co=+$("cols").value,ro=+$("rows").value;c.width=im.width;c.height=im.height;c.hidden=false;$("empty").hidden=true;x.drawImage(im,0,0);let a=(+$("op").value||0)/100,v=$("dir").value==="v",n=v?co:ro;
for(let i=0;i<n;i++)if($("e"+i).checked){let h=$("c"+i).value,r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16);x.fillStyle=`rgba(${r},${g},${b},${a})`;v?x.fillRect(i*c.width/co,0,c.width/co,c.height):x.fillRect(0,i*c.height/ro,c.width,c.height/ro)}
x.strokeStyle=$("lc").value;x.lineWidth=+$("lw").value||1;x.beginPath();for(let i=1;i<co;i++){let p=i*c.width/co;x.moveTo(p,0);x.lineTo(p,c.height)}for(let i=1;i<ro;i++){let p=i*c.height/ro;x.moveTo(0,p);x.lineTo(c.width,p)}x.stroke();
if($("num").value==="表示"){x.font=`bold ${Math.min(+$("fs").value||55,Math.max(12,c.width/co/3))}px Arial`;x.textAlign="center";x.textBaseline="middle";x.lineWidth=4;x.strokeStyle="#000";x.fillStyle="#fff";let k=1;for(let r=0;r<ro;r++)for(let q=0;q<co;q++){let px=(q+.5)*c.width/co,py=(r+.5)*c.height/ro;x.strokeText(k,px,py);x.fillText(k,px,py);k++}}$("save").disabled=false}
$("file").onchange=e=>{if(!e.target.files[0])return;let u=URL.createObjectURL(e.target.files[0]);im=new Image();im.onload=()=>{URL.revokeObjectURL(u);draw()};im.src=u};
["cols","rows","dir"].forEach(id=>$(id).oninput=()=>{colors();draw()});["lw","op","lc","num","fs"].forEach(id=>$(id).oninput=draw);$("save").onclick=()=>{let a=document.createElement("a");a.href=$("cv").toDataURL("image/png");a.download="block-guide.png";a.click()};colors();
</script>
